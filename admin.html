<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Admin - PV</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #0f172a; color: white; padding: 2rem; font-family: 'Inter', sans-serif; }
    .admin-container { max-width: 1200px; margin: 0 auto; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    .car-table { width: 100%; border-collapse: collapse; margin-bottom: 2rem; background: rgba(255,255,255,0.05); border-radius: 12px; overflow: hidden; }
    .car-table th, .car-table td { padding: 1rem; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .car-table th { background: rgba(0,0,0,0.5); font-weight: 600; color: #94a3b8; }
    .admin-btn { padding: 0.5rem 1rem; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; transition: all 0.2s; }
    .btn-edit { background: #3b82f6; color: white; }
    .btn-delete { background: #ef4444; color: white; margin-left: 0.5rem; }
    .btn-add { background: #10b981; color: white; padding: 0.8rem 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
    .admin-btn:hover { opacity: 0.8; }
    .status-toggle { cursor: pointer; padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.85rem; font-weight: bold; border: 1px solid; background: transparent; }
    .status-available { border-color: #10b981; color: #10b981; background: rgba(16, 185, 129, 0.1); }
    .status-sold { border-color: #ef4444; color: #ef4444; background: rgba(239, 68, 68, 0.1); }

    /* Modal Styles */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 100;
      justify-content: center; align-items: center;
    }
    .modal-overlay.open { display: flex; }
    .modal { background: #1e293b; padding: 2rem; border-radius: 12px; width: 100%; max-width: 500px; }
    .modal h2 { margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.9rem; color: #94a3b8; margin-bottom: 0.5rem; }
    .form-group input, .form-group select {
      width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid #334155;
      background: #0f172a; color: white;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem; }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="admin-header">
      <h1>Gerenciar Catálogo</h1>
      <button class="admin-btn btn-add" id="btn-add-car">
        <i data-lucide="plus"></i> Adicionar Veículo
      </button>
    </div>

    <table class="car-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Veículo</th>
          <th>Ano</th>
          <th>Preço</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="admin-car-list">
        <tr><td colspan="6" style="text-align: center;">Carregando dados do Supabase...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="modal-overlay" id="car-modal">
    <div class="modal">
      <h2 id="modal-title">Adicionar Veículo</h2>
      <form id="car-form">
        <input type="hidden" id="car-id" />
        <div class="form-group"><label>Marca</label><input type="text" id="car-make" required /></div>
        <div class="form-group"><label>Modelo</label><input type="text" id="car-model" required /></div>
        <div style="display:flex;gap:1rem;">
          <div class="form-group" style="flex:1"><label>Ano</label><input type="number" id="car-year" required /></div>
          <div class="form-group" style="flex:1"><label>Km</label><input type="text" id="car-mileage" placeholder="Ex: 15.000 km" required /></div>
        </div>
        <div style="display:flex;gap:1rem;">
          <div class="form-group" style="flex:1"><label>Preço</label><input type="text" id="car-price" placeholder="Ex: R$ 750.000" required /></div>
          <div class="form-group" style="flex:1"><label>Tipo</label>
            <select id="car-type">
              <option value="suv">SUV</option>
              <option value="sport">Esportivo</option>
              <option value="sedan">Sedan</option>
            </select>
          </div>
        </div>
        <div class="form-group"><label>URL da Imagem</label><input type="url" id="car-image" required /></div>
        <div class="form-group"><label>Status</label>
            <select id="car-status">
              <option value="available">Disponível</option>
              <option value="sold">Vendido</option>
            </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="admin-btn" style="background:transparent;border:1px solid #475569" id="btn-cancel">Cancelar</button>
          <button type="submit" class="admin-btn btn-add">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="./admin.js"></script>
</body>
</html>
